[project]
name = "radar-kx"
version = "0.1.0"
description = "Isolated production full-text evidence store for Radar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.9,<7",
  "trafilatura>=2,<3",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: the test suite necessarily writes literal tokens, and the point of
# several of them is that a short one is refused.
"tests/**" = ["RUF001", "S101", "S105", "S106"]
# The detector's whole content is non-Latin function words (RUF001/RUF003) written
# as space-separated lists so a word list reads as a word list (SIM905). Turning
# nineteen of them into quoted list literals would cost the readability that makes
# them checkable by eye.
"src/radar_kx/language.py" = ["RUF001", "RUF003", "SIM905"]
# The hedges and connectives this module refuses are Russian as well as English;
# that is the corpus, not a typo.
"src/radar_kx/research.py" = ["RUF001", "RUF003"]
# The editor speaks Russian to its reader; the queue descriptions are the
# interface, not identifiers.
"src/radar_kx/editor_queues.py" = ["RUF001", "RUF003"]
# The welcome prompts and keyword lists are questions a Russian reader is
# invited to ask; every «с» in them is a letter, not a typo.
"src/radar_kx/agent_chat.py" = ["RUF001"]
# Same reason: the skeleton candidates are described to the reader in Russian.
"src/radar_kx/skeleton.py" = ["RUF001", "RUF003"]
# The notices, the licence line and the reader-facing errors are the base's own
# voice, and the base speaks Russian.
"src/radar_kx/agent_api.py" = ["RUF001", "RUF003"]
# The four relation types are named in English because the schema names them so;
# everything the judge is told about them is Russian, like the statements it reads.
"src/radar_kx/linking.py" = ["RUF001", "RUF003"]
# The instruction block is the rules the owner wrote, in the language she wrote
# them in, and the model is asked to answer about Russian sentences.
"src/radar_kx/reading.py" = ["RUF001", "RUF003"]
# Same: nine entity types named in English because the graph names them so, and
# every instruction about them written in the language of the statements.
"src/radar_kx/entities.py" = ["RUF001", "RUF003"]
# The abbreviations a full stop may follow, the quotation marks that close a
# sentence and the bullets that open a list item are Russian as well as English -
# that is the corpus. The abbreviations stay a space-separated word list (SIM905)
# for the same reason as the detector's: a word list has to read as one.
"src/radar_kx/spans.py" = ["RUF001", "RUF003", "SIM905"]
# The rubricator is the instruction the model is given, and it is written in the
# language the corpus and the backbone are written in.
"src/radar_kx/topics.py" = ["RUF001", "RUF003"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src:scripts"
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
