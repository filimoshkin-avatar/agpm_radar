[project]
name = "radar-v2"
version = "0.0.0"
description = "Isolated Radar V2 through the Stage 8 read-only API and frontend boundary"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.10.3",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "PyYAML==6.0.1",
  "ruff==0.12.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["apps", "packages", "tests", "tools"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"packages/delta/engine.py" = ["S608"]
"packages/storage/replication_mutations.py" = ["S608"]
"tests/**" = ["E501", "S101"]

[tool.mypy]
files = ["apps", "packages", "tests", "tools"]
mypy_path = "."
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]
