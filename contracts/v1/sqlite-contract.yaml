contractVersion: 1.0.0
contractFamily: radar-v2/1
sqlite:
  requiredRuntimeVersion: 3.45.1
  requiredSourceId: "2024-01-30 16:01:20 e876e51a0ed5c5b3126f52e532044363a014bc594cfefa87ffb5b82257ccalt1"
  requiredCompileOptions:
    - ENABLE_FTS5
    - THREADSAFE=1
  applicationId: 1380009010
  applicationIdAscii: RAD2
  userVersion: 1
  activeReader:
    uriMode: ro
    immutable: true
    reopenAfterPointerSwitch: true
    pragmas:
      query_only: 1
      foreign_keys: 1
      trusted_schema: 0
      busy_timeout_ms: 5000
  stagingWriter:
    transaction: BEGIN IMMEDIATE
    explicitIdsAndTimestamps: true
    forbiddenGenerators: [AUTOINCREMENT, sqlite_sequence, random, local-now]
    pragmas:
      foreign_keys: 1
      journal_mode: DELETE
      synchronous: FULL
      secure_delete: 1
      temp_store: MEMORY
      trusted_schema: 0
      busy_timeout_ms: 5000
  sealedArtifact:
    journalMode: DELETE
    forbiddenSidecars: [wal, shm, journal]
    requiredChecks:
      - integrity_check
      - foreign_key_check
      - schema_version
      - logical_state_hash
      - fts_rebuild_and_parity
writers:
  project_manager:
    directSql: false
    produces: [candidate]
  source_publisher:
    directSql: true
    scope: staging_copy_only
    lock: radar_mutation
  application_migrator:
    directSql: true
    scope: staging_copy_only
    lock: radar_mutation
    mayChangeSchema: true
  bootstrap_importer:
    directSql: true
    scope: source_staging_before_release_zero_only
    permanentlyDisabledAfterReleaseZero: true
    lock: radar_mutation
  remote_activator:
    directSql: true
    authority: mirror_only
    acceptedInput: validated_typed_delta
    scope: production_staging_copy_only
    lock: radar_mutation
  public_api:
    directSql: false
    readOnly: true
    scope: versioned_published_public_views_only
locks:
  perHost: radar_mutation
  implementation: fd-backed-flock
  acquisitionOrder: [source, remote]
  fences: [base_release, logical_state_hash, schema_version, release_sequence]
  ambiguousOperationLatch: needs_reconciliation
hashing:
  algorithm: sha256
  encoding: canonical-json-lines-utf8
  tableOrder: lexical
  rowOrder: primary-key
  normalize:
    "null": json-null
    integers: base10-no-leading-zero
    reals: shortest-roundtrip-json-number
    text: unicode-nfc
    jsonTextColumns: parse-sort-keys-compact
  excludes:
    - derived FTS5 virtual/internal tables
    - host-local journals
    - SQLite page layout and freelist
    - schema_migrations metadata table
    - application_compatibility metadata table
    - content_releases self-referential release marker table
  replicaEquality:
    - logical domain state hash
    - per-table hashes for excluded replicated metadata tables
    - schema version and table contract version
contentMutationTables:
  - content_releases
  - source_snapshots
  - sources
  - materials
  - material_sources
  - material_evidence
  - editorial_queue
  - issues
  - issue_materials
  - issue_analysis
  - material_analysis
  - llm_attempts
  - source_rules
  - material_quality
  - material_rubrics
  - daily_stats
  - gazettes
  - gazette_assets
