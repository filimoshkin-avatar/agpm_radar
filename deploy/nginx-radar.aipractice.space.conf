server {
    listen 80;
    server_name radar.aipractice.space;

    root /mnt/vdd/Radar/work/radar-app;
    index index.html;

    access_log /mnt/vdd/Radar/data/logs/backend/nginx-access.log;
    error_log /mnt/vdd/Radar/data/logs/backend/nginx-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|ttf|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
